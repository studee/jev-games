<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05080f" />
    <title>Invaders — Jev arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="invaders">
    <main class="layout">
      <div class="shell shell-invaders">
        <canvas id="game" width="800" height="640" aria-label="Space Invaders game"></canvas>
      </div>
      <aside class="feed" aria-live="polite">
        <nav class="games">
          <a href="/">Flappy</a>
          <a href="/pong.html">Pong</a>
          <a href="/invaders.html" aria-current="page">Invaders</a>
          <a href="/worms.html">Worms</a>
          <a href="/flight.html">Flight</a>
          <a href="/space.html">Space</a>
          <a href="/drive.html">Drive</a>
          <a href="/survival.html">Survival</a>
        </nav>
        <p class="feed-kicker">TypeSafe Jev</p>
        <h1>Invaders</h1>
        <p class="feed-copy">
          Jev locks one column per attack run — not a screenshot. Code slides the
          cannon under that x, fires, and dodges. Play with ← → and space.
        </p>
        <div class="mode-row">
          <a href="/invaders.html?mode=you" data-mode="you">You</a>
          <a href="/invaders.html?mode=jev" class="is-active" data-mode="jev">Jev</a>
        </div>
        <div class="feed-stat">
          <span id="pilot-action">JEV PLAYING</span>
          <span id="pilot-meta">locking a column</span>
        </div>
        <section class="latency" aria-label="Jev call latency">
          <div class="latency-head">
            <p class="feed-kicker">Call latency</p>
            <div class="latency-stats">
              <span><em id="lat-last">—</em> last</span>
              <span><em id="lat-avg">—</em> 8-call avg</span>
            </div>
          </div>
          <canvas id="latency-chart" width="400" height="148"></canvas>
        </section>
        <ol id="decisions"></ol>
      </aside>
    </main>
    <script src="/invaders.js"></script>
  </body>
</html>
