<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16222c" />
    <title>Survival — Jev arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="survival">
    <main class="layout">
      <div class="shell shell-survival">
        <canvas id="game" width="720" height="720" aria-label="Survival tag"></canvas>
      </div>
      <aside class="feed" aria-live="polite">
        <nav class="games">
          <a href="/">Flappy</a>
          <a href="/pong.html">Pong</a>
          <a href="/invaders.html">Invaders</a>
          <a href="/worms.html">Worms</a>
          <a href="/flight.html">Flight</a>
          <a href="/space.html">Space</a>
          <a href="/drive.html">Drive</a>
          <a href="/survival.html" aria-current="page">Survival</a>
        </nav>
        <p class="feed-kicker">TypeSafe Jev</p>
        <h1>Survival</h1>
        <p class="feed-copy">
          One red, nine green. Red tags turn greens red. You start red (gold ring).
          Everyone else is a Jev. WASD or arrows, or drag.
        </p>
        <div class="feed-stat">
          <span id="pilot-action">HUNT</span>
          <span id="pilot-meta">← → ↑ ↓ · space rematch</span>
        </div>
        <section class="latency" aria-label="Jev call latency">
          <div class="latency-head">
            <p class="feed-kicker">Call latency</p>
            <div class="latency-stats">
              <span><em id="lat-last">—</em> last</span>
              <span><em id="lat-avg">—</em> 8-call avg</span>
            </div>
          </div>
          <canvas id="latency-chart" width="400" height="148"></canvas>
        </section>
        <ol id="decisions"></ol>
      </aside>
    </main>
    <script src="/survival.js"></script>
  </body>
</html>
