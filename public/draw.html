<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12141c" />
    <title>Draw — Jev arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="draw">
    <main class="layout">
      <div class="shell shell-draw">
        <canvas id="game" width="960" height="540" tabindex="0" aria-label="Blank drawing canvas. Type what to draw, then press Enter."></canvas>
      </div>
      <aside class="feed" aria-live="polite">
        <nav class="games">
          <a href="/">Flappy</a>
          <a href="/pong.html">Pong</a>
          <a href="/invaders.html">Invaders</a>
          <a href="/worms.html">Worms</a>
          <a href="/draw.html" aria-current="page">Draw</a>
          <a href="/flight.html">Flight</a>
          <a href="/drive.html">Drive</a>
        </nav>
        <p class="feed-kicker">TypeSafe Jev</p>
        <h1>Draw</h1>
        <p class="feed-copy">
          Blank paper. Type on the canvas, press Enter. Nine sections paint
          at once. Each patch sees the pixels already printed around it.
        </p>
        <div class="feed-stat">
          <span id="pilot-action">WAITING</span>
          <span id="pilot-meta">type on the canvas · enter</span>
        </div>
        <section class="latency" aria-label="Jev call latency">
          <div class="latency-head">
            <p class="feed-kicker">Call latency</p>
            <div class="latency-stats">
              <span><em id="lat-last">—</em> last</span>
              <span><em id="lat-avg">—</em> 8-call avg</span>
            </div>
          </div>
          <canvas id="latency-chart" width="400" height="148"></canvas>
        </section>
        <ol id="decisions"></ol>
      </aside>
    </main>
    <script src="/draw.js"></script>
  </body>
</html>
